name: contact_scanner
description: "Fully offline handwritten contact-sheet scanner with on-device OCR."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Camera + files
  camera: ^0.11.0
  path_provider: ^2.1.3
  path: ^1.9.0

  # Pure-Dart imaging kernel (default DocumentImageProcessor backend)
  image: ^4.5.3

  # On-device inference
  tflite_flutter: ^0.12.1

  # Local persistence
  sqflite: ^2.4.3

  # Native phonebook
  flutter_contacts: ^1.1.9

  # Permissions
  permission_handler: ^12.0.3

  # Background expiry scheduling (Android WorkManager / iOS BGTaskScheduler)
  workmanager: ^0.10.10

  # Local settings
  shared_preferences: ^2.3.2

  intl: ^0.19.0

  # OPTIONAL OpenCV backend. Disabled by default: opencv_dart downloads a
  # ~100 MB OpenCV SDK through CMake FetchContent at BUILD time and needs
  # CocoaPods on iOS. Runtime stays fully offline either way.
  # See docs/OPENCV_PIPELINE.md to enable OpenCvImageProcessor.
  # opencv_dart: ^1.4.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.2+1

flutter:
  uses-material-design: true
  assets:
    - assets/models/
