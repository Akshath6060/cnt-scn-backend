[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contact-scanner-backend"
version = "0.1.0"
description = "Offline handwritten contact recognition training and export pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "datasets>=2.16",
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  "pandas>=2.0",
  "Pillow>=10.0",
  "torch>=2.1",
  "torchvision>=0.16",
  "onnx>=1.15",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
